<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Эта строка критически важна для корректного отображения на мобильных телефонах -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Андрей Саматарев — Персональная страница</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            line-height: 1.6; 
            color: #333; 
            max-width: 600px; 
            margin: 0 auto; 
            padding: 20px; 
            background-color: #f4f6f8; 
        }
        .photo { 
            width: 100%; 
            max-width: 300px; 
            height: auto; 
            border-radius: 12px; 
            display: block; 
            margin: 0 auto 20px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        }
        h1 { 
            text-align: center; 
            color: #1a1a1a; 
            font-size: 26px; 
            margin-bottom: 10px; 
        }
        p { 
            text-align: center; 
            color: #555; 
            font-size: 18px; 
            margin-bottom: 30px; 
        }
        .btn { 
            display: block; 
            width: 100%; 
            padding: 16px; 
            margin: 12px 0; 
            text-align: center; 
            background-color: #0088cc; 
            color: white; 
            text-decoration: none; 
            border-radius: 10px; 
            font-size: 18px; 
            font-weight: bold; 
            box-sizing: border-box; 
            transition: background 0.2s;
        }
        .btn:active { 
            background-color: #006699; 
        }
        .btn-phone {
            background-color: #28a745;
        }
        .btn-phone:active {
            background-color: #1e7e34;
        }
        .footer { 
            text-align: center; 
            margin-top: 40px; 
            font-size: 14px; 
            color: #888; 
        }
    </style>
</head>
<body>

    <!-- Фото загружается из того же репозитория -->
    <img src="photo.jpg" alt="Андрей Саматарев" class="photo">
    
    <h1>Андрей Саматарев</h1>
    <p>Более 50 лет опыта. Надёжные и актуальные решения для ваших задач.</p>
    
    <!-- Кнопки сделаны как ссылки. Они 100% работают на любом телефоне -->
    <a href="https://t.me/SamatarevleadsBot" class="btn">📩 Оставить заявку в Telegram</a>
    <a href="tel:+70000000000" class="btn btn-phone">📞 Позвонить мне</a>
    
    <div class="footer">
        <p>© 2026 Андрей Саматарев. Все права защищены.</p>
    </div>

</body>
</html>
